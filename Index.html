<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1a237e, #283593);
      color: white;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.85;
    }

    .search-container {
      max-width: 700px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #1a237e;
    }

    .search-box button {
      padding: 12px 28px;
      background: #1a237e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: #283593;
    }

    .search-box button:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }

    .info {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #777;
    }

    .results-container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 16px 24px;
    }

    .result-count {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .result-card {
      background: white;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 4px solid #1a237e;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .result-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .result-card .nama {
      font-size: 16px;
      font-weight: 600;
      color: #1a237e;
      margin-bottom: 6px;
    }

    .result-card .nip {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .result-card .detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
    }

    .result-card .detail-item {
      font-size: 13px;
    }

    .result-card .detail-item .label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .result-card .detail-item .value {
      color: #333;
      font-weight: 500;
      word-break: break-word;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .no-results .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .no-results p {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      text-align: center;
      padding: 20px;
      color: #c62828;
      background: #ffebee;
      border-radius: 8px;
      margin: 0 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Pencarian Data PNS</h1>
    <p>Sistem Informasi Pencarian Pegawai Negeri Sipil</p>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Masukkan NIP atau Nama PNS..." autofocus>
      <button id="searchBtn" onclick="doSearch()">Cari</button>
    </div>
    <p class="info">Ketikkan NIP atau Nama, lalu tekan Enter atau klik tombol Cari</p>
  </div>

  <div class="results-container" id="resultsContainer"></div>

  <script>
    var input = document.getElementById('searchInput');
    var btn = document.getElementById('searchBtn');
    var container = document.getElementById('resultsContainer');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        doSearch();
      }
    });

    function doSearch() {
      var query = input.value.trim();
      if (!query) {
        container.innerHTML = '';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Mencari...';
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Mencari data...</p></div>';

      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(function(err) {
          container.innerHTML = '<div class="error-msg">Terjadi kesalahan: ' + err.message + '</div>';
          btn.disabled = false;
          btn.textContent = 'Cari';
        })
        .searchPNS(query);
    }

    function renderResults(results) {
      btn.disabled = false;
      btn.textContent = 'Cari';

      if (!results || results.length === 0) {
        container.innerHTML = '<div class="no-results"><div class="icon">&#128269;</div><p>Data tidak ditemukan. Coba kata kunci lain.</p></div>';
        return;
      }

      var html = '<div class="result-count">Ditemukan ' + results.length + ' data</div>';

      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        html += '<div class="result-card">';
        html += '<div class="nama">' + escapeHtml(r.nama) + '</div>';
        html += '<div class="nip">NIP: ' + escapeHtml(r.nip) + '</div>';
        html += '<div class="detail">';
        html += detailItem('OPD', r.opd);
        html += detailItem('Jabatan', r.namaJabatan);
        html += detailItem('TMT Pensiun', formatDate(r.tmtPensiun));
        html += detailItem('Tempat Arsip', r.tempatArsip);
        html += '</div></div>';
      }

      container.innerHTML = html;
    }

    function detailItem(label, value) {
      return '<div class="detail-item"><div class="label">' + label + '</div><div class="value">' + escapeHtml(value || '-') + '</div></div>';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(val) {
      if (!val) return '-';
      if (val instanceof Date) {
        var m = val.getMonth() + 1;
        var d = val.getDate();
        var y = val.getFullYear();
        return (d < 10 ? '0' + d : d) + '/' + (m < 10 ? '0' + m : m) + '/' + y;
      }
      return String(val);
    }
  </script>

</body>
</html>
